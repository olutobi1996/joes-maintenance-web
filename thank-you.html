<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You - Prop-Up Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f8fa;
      color: #333;
      font-family: 'Segoe UI', sans-serif;
    }
    .thank-you {
      text-align: center;
      padding: 80px 20px;
    }
    .thank-you img {
      max-width: 150px;
      margin-bottom: 30px;
    }
    .thank-you h1 {
      font-size: 2.5rem;
      color: #1d3557;
    }
    .thank-you p {
      font-size: 1.1rem;
      margin-top: 15px;
      color: #555;
    }
    .btn-back {
      margin-top: 30px;
      background-color: #007bff;
      border: none;
      color: white;
    }
  </style>
</head>
<body>
  <div class="thank-you container">
    <!-- Friend's logo -->
    <img src="assets/propuplogo.jpg" alt="Logo">
    <h1>Thank You for Your Request!</h1>
    <p>We’ve received your quote request and will be in touch shortly.</p>
    <p>Our maintenance team is reviewing your submission and will provide a response within 24 hours.</p>
    <a href="/" class="btn btn-back">Return to Home</a>
  </div>
</body>
</html>
